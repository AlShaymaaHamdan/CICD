name: Node js App

on:
    push:
        branches: [ main, prod ] #main = QA 0.0.0-testing
    pull_request: 
        branches: [ main ]


jobs:

    prepare: 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Extract Version
          run : | 
              chmod +x version_extract.sh
              ./version_extract.sh

        - name:  Debugging the extracted Version
          run: echo $VERSION

        - name: Upload Version artifact
          uses: actions/upload-artifact@v4
          with:
            name: version
            path: version.yaml

    # config_aws:
    #   runs-on: ubuntu-latest
    #   steps:
    #     - name : Config AWS credentials
    #       uses: aws-actions/configure-aws-credentials@v4
    #       with:
    #         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #         aws-region: ${{ secrets.AWS_REGION }}   
            
    #     - name: Login into AWS ecr
    #       uses: aws-actions/amazon-ecr-login@v2
    build:
      runs-on: ubuntu-latest
      needs: prepare
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: |
              chmod +x load_version.sh
              ./load_version.sh

        - name: Setup Nodejs
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: 'npm'

        - name: Install dep
          run: npm i

        - name: Package app artifact
          run: |
              chmod +x package_artifact.sh
              ./package_artifact.sh

        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: app-build
            path: artifacts/
    docker:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: version

            - name: Load version into enviroment
              run: |
                chmod +x load_version.sh
                ./load_version.sh

            - name: Debugging the extracted Version
              run: echo $VERSION

            - name: Download artifact 
              uses: actions/download-artifact@v4
              with:
                name: app-build

            
            - name: Extract app artifact
              run: |
                  chmod +x extract_artifact.sh
                  ./extract_artifact.sh

            - name : Config AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}   
                
            - name: Login into AWS ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push Image 
              uses: docker/build-push-action@v6 
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ env.VERSION }}
    promote:
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/prod'
      needs: docker
      outputs:
        BASE_TAG: ${{ steps.promote.outputs.BASE_TAG }}
        LATEST_TAG: ${{ steps.promote.outputs.LATEST_TAG }}

      steps:
         - name: Checkout repo
           uses: actions/checkout@v4

         - name : Config AWS credentials
           uses: aws-actions/configure-aws-credentials@v4
           with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}   
            
         - name: Login into AWS ecr
           uses: aws-actions/amazon-ecr-login@v2

         - name: Promote the latest test tag
           id: promote
           env: 
              AWS_REGION: ${{ secrets.AWS_REGION }}
              AWS_ECR_URI: ${{ secrets.AWS_ECR_URI }}
           run: |
                --repository-name cicd-shaymaa \
                --region "$AWS_REGION" \
                --output json \
                | jq -r '
                    .imageDetails[]
                    | select(.imageTags != null)
                    | select([.imageTags[] | contains("test")] | any)
                    | {pushedAt: .imagePushedAt, tag: (.imageTags[] | select(contains("test")))}
                  ' | jq -s 'sort_by(.pushedAt) | last.tag')

                LATEST_TAG=$(echo "$LATEST_TAG" | tr -d '"')
                echo "Latest_tag = $LATEST_TAG"
                export BASE_TAG=$(echo "$LATEST_TAG" | cut -d'-' -f1 | tr -d '"')
                echo "BASE_TAG=$BASE_TAG"
                echo "LATEST_TAG = $LATEST_TAG" >> $GITHUB_OUTPUT
                echo "BASE_TAG=$BASE_TAG" >> $GITHUB_OUTPUT
    push-promoted-image:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/prod'
        needs: promote
        steps:
        - name : Config AWS credintails
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }} 

        - name:  Login into AWS ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Pull and push the image 
          run: |
              docker pull ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.LATEST_TAG }}
              docker tag ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.LATEST_TAG }} /
              ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.BASE_TAG }}
              docker push ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.BASE_TAG }}
    
    deploy:
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/prod'
      needs:
        - promote
        - push-promoted-image
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: |
            chmod +x load_version.sh
            ./load_version.sh

        - name: ssh to the server
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.PUPLIC_IP }}
            username: ${{ secrets.HOST_NAME }}
            key: ${{ secrets.PRIVATE_KEY }}
            script: |
              echo "ECR Login"
              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.BASE_TAG }}

              echo "pull image"
              docker pull ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.BASE_TAG }}
              
              docker stop cicd-shaymaa
              docker rm cicd-shaymaa
              
              docker run -dp 3000:3000 --name cicd-shaymaa ${{ secrets.AWS_ECR_URI }}/cicd-shaymaa:${{ needs.promote.outputs.BASE_TAG }}